name: tareas-v2-preview

services:
  app:
    build: .
    image: tareas-v2-preview:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8288:4300"
    environment:
      HOST: 0.0.0.0
      PORT: "4300"
      APP_PUBLIC_ORIGIN: https://coolify-vps.tail96bc47.ts.net:8450
      APP_TRUST_PROXY: "true"
      COOKIE_SECURE: "true"
      VIKUNJA_DEFAULT_BASE_URL: https://tareas.juanma.rocks
      APP_SESSION_STORE_PATH: /app/.data/app-sessions.enc
      APP_SESSION_KEY_PATH: /app/.data/app-sessions.key
    volumes:
      - preview_sessions:/app/.data
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  preview_sessions:
